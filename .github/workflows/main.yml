name: Deploy Jakuq_AI

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Pobierz pliki strony
        uses: actions/checkout@v4

      - name: Konfiguracja GitHub Pages
        uses: actions/configure-pages@v5

      - name: Przygotuj stronę
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Opublikuj stronę
        id: deployment
        uses: actions/deploy-pages@v4
