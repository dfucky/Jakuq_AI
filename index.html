<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jakuq_AI</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #111827, #2563eb);
            color: white;
            text-align: center;
        }

        .container {
            padding: 40px;
        }

        h1 {
            font-size: 80px;
            margin-bottom: 35px;
            letter-spacing: 2px;
        }

        button {
            border: none;
            background: white;
            color: #2563eb;
            font-size: 24px;
            font-weight: bold;
            padding: 16px 40px;
            border-radius: 15px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            transform: scale(1.08);
            background: #e5e7eb;
        }

        #wynik {
            display: none;
            margin-top: 35px;
            font-size: 42px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Jakuq_AI</h1>

        <button onclick="pokazTekst()">Wypróbuj</button>

        <div id="wynik">
            ccwd lysa palo
        </div>
    </div>

    <script>
        function pokazTekst() {
            document.getElementById("wynik").style.display = "block";
        }
    </script>

</body>
</html>
